<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + user-scalable=no: this is a touch game, and pinch-zoom on a
       puzzle board means the player zooms the PAGE when they meant to drag a piece. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a24">
  <title>Glasslight Puzzle</title>
  <style>
    :root { --pane: #1b1a24; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--pane);
      overflow: hidden;
      /* No text selection or callout — a long drag across the board must not select or
         pop the iOS context menu. */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                   "Malgun Gothic", "Segoe UI", sans-serif;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(120% 80% at 50% 0%, #2a2836 0%, var(--pane) 60%);
    }
    /* The game was laid out for 1206x2622 (a phone). Letterbox to that aspect instead of
       filling a desktop window, or the board's own fit maths gets a shape it was never
       designed for and the pane ends up tiny in the middle of a wide field. */
    #shell {
      position: relative;
      aspect-ratio: 1206 / 2622;
      height: 100%; width: auto;
      max-width: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 60px rgba(0,0,0,.55);
    }
    @media (max-aspect-ratio: 1206/2622) { #shell { width: 100%; height: auto; } }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }

    #boot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #d8cfc0; background: var(--pane); transition: opacity .4s; z-index: 2;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot h1 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: .02em; }
    #bar { width: 62%; max-width: 300px; height: 4px; border-radius: 2px; background: #322f3d; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: #d8a24a; transition: width .2s; }
    #pct { font-size: 12px; color: #8d8598; font-variant-numeric: tabular-nums; }
    #err {
      position: absolute; inset: 0; display: none; padding: 24px; z-index: 3;
      background: var(--pane); color: #e6b0a8; font-size: 13px; line-height: 1.6;
      overflow: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="shell">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="boot">
        <h1>Glasslight Puzzle</h1>
        <div id="bar"><div id="fill"></div></div>
        <div id="pct">불러오는 중…</div>
      </div>
      <div id="err"></div>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Web.data.unityweb?v=20260819073807",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb?v=20260819073807",
      codeUrl: buildUrl + "/Web.wasm.unityweb?v=20260819073807",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Supercent",
      productName: "Glimmith",
      productVersion: "0.1.0",
      // Surfaced instead of swallowed. A silent runtime error here is indistinguishable
      // from "still loading", which is how a broken build gets shipped as a link.
      showBanner: function (msg, type) {
        if (type !== "error") { console.warn("[unity]", msg); return; }
        var e = document.querySelector("#err");
        e.style.display = "block";
        e.textContent += msg + "\n";
      },
    };

    var fill = document.querySelector("#fill");
    var pct = document.querySelector("#pct");
    var boot = document.querySelector("#boot");

    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js?v=20260819073807";
    script.onerror = function () {
      config.showBanner("로더를 불러오지 못했습니다: " + script.src, "error");
    };
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        var v = Math.round(p * 100);
        fill.style.width = v + "%";
        pct.textContent = v + "%";
      }).then(function () {
        boot.classList.add("done");
      }).catch(function (message) {
        config.showBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
