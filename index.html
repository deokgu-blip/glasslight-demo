<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + user-scalable=no: this is a touch game, and pinch-zoom on a
       puzzle board means the player zooms the PAGE when they meant to drag a piece. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141A33">
  <title>Glasslight Puzzle</title>
  <style>
    :root {
      /* ⚠ 추측값 금지 — 게임의 로딩 화면(Builds/Flow 촬영)에서 **픽셀로 잰** 값이다.
         위 #161C38 → 아래 #0D0D1C 세로 그라데이션, 진행바 #C77A3B.
         예전엔 #1b1a24(갈색기) 였고, 그래서 이 화면에서 게임으로 넘어갈 때
         배경이 눈에 띄게 바뀌어 사용자가 "이 화면은 왜 있냐"고 물었다(2026-08-21). */
      --sky-top: #161C38; --sky-bottom: #0D0D1C; --ember: #C77A3B; --pane: #141A33;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--pane);
      overflow: hidden;
      /* No text selection or callout — a long drag across the board must not select or
         pop the iOS context menu. */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                   "Malgun Gothic", "Segoe UI", sans-serif;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    }
    /* The game was laid out for 1206x2622 (a phone). Letterbox to that aspect instead of
       filling a desktop window, or the board's own fit maths gets a shape it was never
       designed for and the pane ends up tiny in the middle of a wide field. */
    #shell {
      position: relative;
      aspect-ratio: 1206 / 2622;
      height: 100%; width: auto;
      max-width: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 60px rgba(0,0,0,.55);
    }
    @media (max-aspect-ratio: 1206/2622) { #shell { width: 100%; height: auto; } }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }

    /* 게임의 로딩 화면과 **같은 배치**로 맞춘다 — 별 · 진행바 · 로고 순, 아래쪽 1/4 지점.
       두 화면이 이어져 보이게 하는 것이 목적이므로, 여기 숫자를 바꾸려면
       게임 쪽(LoadingScreen)도 같이 봐야 한다. */
    #boot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; gap: 14px;
      padding-bottom: 26%;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
      transition: opacity .45s; z-index: 2;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #spark { width: 14px; height: 14px; opacity: .85;
      background: #EFE6CF; clip-path: polygon(50% 0%,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0% 50%,42% 42%); }
    #bar { width: 46%; max-width: 260px; height: 5px; border-radius: 3px; background: #2A2E45; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: var(--ember); transition: width .25s; border-radius: 3px; }
    #logo { width: 46%; max-width: 260px; height: auto; }
    #pct { font-size: 11px; color: #6E748A; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    #err {
      position: absolute; inset: 0; display: none; padding: 24px; z-index: 3;
      background: var(--pane); color: #e6b0a8; font-size: 13px; line-height: 1.6;
      overflow: auto; white-space: pre-wrap;
    }
  </style>
</head>

      <div id="boot">
